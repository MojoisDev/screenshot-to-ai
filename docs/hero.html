<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Familjen+Grotesk:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0b0e14;
    --ink2:#121722;
    --line:#1f2734;
    --fg:#e8edf4;
    --muted:#8a97ab;
    --marquee:#b8ff3d;       /* selection-green accent */
    --marquee-soft:rgba(184,255,61,.14);
    --cyan:#57e0ff;
    --pink:#ff5c8a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:600px}
  body{
    font-family:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(1200px 520px at 82% -10%, rgba(87,224,255,.10), transparent 60%),
      radial-gradient(900px 500px at 8% 120%, rgba(184,255,61,.08), transparent 55%),
      var(--ink);
    color:var(--fg);
    position:relative;
    overflow:hidden;
  }
  /* faint dotted grid texture */
  body::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px;
    mask:radial-gradient(80% 80% at 50% 40%, #000 55%, transparent 100%);
    -webkit-mask:radial-gradient(80% 80% at 50% 40%, #000 55%, transparent 100%);
  }
  .wrap{position:relative;height:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:0;}

  /* ---------- LEFT: copy ---------- */
  .left{padding:70px 0 64px 76px;display:flex;flex-direction:column;justify-content:center;z-index:3}
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--marquee);display:flex;align-items:center;gap:12px;margin-bottom:26px;
  }
  .kicker::before{content:"";width:34px;height:2px;background:var(--marquee);display:inline-block}
  h1{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:78px;line-height:.98;letter-spacing:-.02em;margin-bottom:22px;
  }
  h1 .arrow{color:var(--marquee)}
  h1 .ai{
    background:linear-gradient(92deg,var(--cyan),var(--marquee));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:22px;line-height:1.45;color:var(--muted);max-width:430px;margin-bottom:34px}
  .sub b{color:var(--fg);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:9px}
  .tag{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.04em;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;background:rgba(255,255,255,.015);
  }
  .tag.k{color:var(--fg);border-color:#2b3546}

  /* ---------- RIGHT: the capture motif ---------- */
  .right{position:relative;z-index:2}
  .stage{
    position:absolute;inset:52px 58px 52px 8px;
    background:linear-gradient(160deg,var(--ink2),#0c1119);
    border:1px solid var(--line);border-radius:18px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }
  .bar{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(255,255,255,.02)}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .bar .title{margin-left:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}

  .canvas{position:relative;height:calc(100% - 40px)}
  /* faux page content lines */
  .lines{position:absolute;inset:34px 40px;display:flex;flex-direction:column;gap:15px}
  .ln{height:11px;border-radius:6px;background:#1a2230}
  .ln.w1{width:78%}.ln.w2{width:92%}.ln.w3{width:60%}.ln.w4{width:85%}.ln.w5{width:48%}

  /* the selection marquee — the "circle to search" gesture */
  .marquee{
    position:absolute;left:120px;top:96px;width:250px;height:150px;
    border:2.5px dashed var(--marquee);border-radius:10px;
    background:var(--marquee-soft);
    box-shadow:0 0 0 9999px rgba(6,9,14,.55), 0 0 40px rgba(184,255,61,.25);
  }
  .handle{position:absolute;width:12px;height:12px;background:var(--ink);border:2.5px solid var(--marquee);border-radius:3px}
  .handle.tl{left:-7px;top:-7px}.handle.tr{right:-7px;top:-7px}
  .handle.bl{left:-7px;bottom:-7px}.handle.br{right:-7px;bottom:-7px}
  .cursor{position:absolute;right:-6px;bottom:-10px;font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .size{position:absolute;top:-30px;left:0;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--marquee);background:rgba(11,14,20,.9);border:1px solid var(--line);padding:3px 8px;border-radius:6px}

  /* AI answer chip flying out */
  .chip{
    position:absolute;right:20px;bottom:26px;display:flex;align-items:center;gap:11px;
    background:rgba(12,17,25,.92);border:1px solid #263143;border-radius:13px;padding:12px 15px;
    box-shadow:0 20px 44px -18px rgba(0,0,0,.9);
  }
  .chip .spark{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--cyan),var(--marquee));
    display:grid;place-items:center;font-size:18px;color:#06212a;font-weight:800;
  }
  .chip .txt{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;color:var(--muted)}
  .chip .txt b{color:var(--fg)}

  /* steps ribbon */
  .steps{position:absolute;left:76px;bottom:40px;display:flex;align-items:center;gap:14px;z-index:4}
  .step{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--fg);display:flex;align-items:center;gap:9px}
  .step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--marquee);color:var(--marquee);display:grid;place-items:center;font-size:11px}
  .sep{color:#33405400;width:16px;height:1px;background:var(--line)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="kicker">Linux desktop · circle to search</div>
      <h1>Screenshot<br><span class="arrow">→</span> <span class="ai">AI</span></h1>
      <p class="sub">Press a hotkey, <b>drag a box</b> around anything on screen, and it lands in your AI — ready to paste and ask.</p>
      <div class="tags">
        <span class="tag k">KDE</span>
        <span class="tag k">GNOME</span>
        <span class="tag">Wayland</span>
        <span class="tag">X11</span>
        <span class="tag">no daemon</span>
        <span class="tag">MIT</span>
      </div>
    </div>

    <div class="right">
      <div class="stage">
        <div class="bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="title">~ your screen</span>
        </div>
        <div class="canvas">
          <div class="lines">
            <div class="ln w2"></div><div class="ln w1"></div><div class="ln w4"></div>
            <div class="ln w3"></div><div class="ln w2"></div><div class="ln w5"></div>
            <div class="ln w4"></div><div class="ln w1"></div>
          </div>
          <div class="marquee">
            <span class="size">drag to capture</span>
            <span class="handle tl"></span><span class="handle tr"></span>
            <span class="handle bl"></span><span class="handle br"></span>
            <span class="cursor">⌖</span>
          </div>
          <div class="chip">
            <div class="spark">✦</div>
            <div class="txt"><b>Ask your AI</b><br>image on clipboard ✓</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
